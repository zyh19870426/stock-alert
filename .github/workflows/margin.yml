name: margin-sector-daily

# 板块/题材消耗两融占比 日更存档：每交易日收盘后抓全市场个股融资余额（datacenter-web RPTA_WEB_RZRQ_GGMX，T+1）
# → 按板块成员聚合 → 占全市场比降序 → 写 margin-sector-history.json，供控制台「两融·杠杆水位」
# 详情页的「板块/题材消耗两融占比」面板直读（前端零请求）。
# cron 用 UTC：北京 16:20 = UTC 8:20（在 flow-daily 16:10 之后错开 10 分钟，避免同时抢预算）。
# ⚠️ 取的是**最新已披露日**（T+1，通常为上一交易日）；非交易日 cron 照常触发时仍返回同一份最新快照，
#    属正常，照常写盘即可（本脚本不依赖 trade-day.js）。
# ⚠️ 2026-10-13 换源：原 push2 clist fid=f207 字段已失效（四域名全 200 但值全为占位符 "-"），
#    改用 datacenter-web 融资融券个股明细；实测当日 4455 只 / 25066 亿元。
on:
  schedule:
    - cron: '20 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: margin-sector-daily
  cancel-in-progress: false

jobs:
  margin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build sector margin-share archive
        run: node margin-sector.js

      - name: Commit archive
        run: |
          git add margin-sector-history.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update sector margin-share archive [skip ci]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push || (sleep 5 && git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push)
          else
            echo "存档无变化"
          fi
