name: flow-daily

# 板块资金流日更存档：每交易日收盘后把「行业全量 + 概念前80」的当日主力净流入
# 增量写入 flow-history.json（保留 60 天），供控制台「资金流向监控」页在
# 东财接口被限流/不可达时兜底直读。
# cron 用 UTC：北京 16:10 = UTC 8:10（收盘后，fng-daily 16:05 之后错开 5 分钟）
# ⚠️ 非交易日（A 股节假日）在这里是**照常触发**的：cron 的 1-5 只认工作日。
#    脚本内有交易日闸门（trade-day.js）→ 非交易日打印一行后直接退出、不写盘、不产生 commit。
on:
  schedule:
    - cron: '10 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flow-daily
  cancel-in-progress: false

jobs:
  flow:
    runs-on: ubuntu-latest
    # ⚠️ 15 分钟**不够**：2026-10-08、10-09 两次 run 都在 15 分 17 秒处被判 cancelled
    #    （started 08:23:49Z → completed 08:39:06Z），即被这条超时线掐断，
    #    ⇒ 存档停在 09-30、页面一直显示旧数据。
    #    脚本内虽有 8 分钟预算线，但只覆盖 daykline 回补，网络重试堆积时会超出去。
    #    先放宽到 30 分钟止血，同时脚本侧要收紧单次重试上限（见 flow-daily.js 注释）。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ★2026-11-28 根治：东财 push2 出口偶发整体不可达（11-25/26/27 连续三天
      #   clist 六通道 fetch failed，页面停更 11-24）。重跑 #39 立即成功 ⇒ 是网络抖动
      #   而非代码错误。加 run 内重试：最多 3 次、间隔 30s，让偶发抖动自愈；
      #   3 次全败仍非 0 退出、后面 freshness 硬校验照常报红，绝不静默放行。
      - name: Update sector fund-flow archive
        run: |
          for i in 1 2 3; do
            echo "=== 资金流生成 第 $i/3 次 ==="
            if node flow-daily.js; then
              echo "✅ 第 $i 次成功"
              exit 0
            fi
            if [ "$i" -lt 3 ]; then echo "⚠ 第 $i 次失败，30s 后重试"; sleep 30; fi
          done
          echo "❌ 3 次均失败，报红（不提交、保留上一版好数据）"
          exit 1

      - name: Commit archive
        run: |
          git add flow-history.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update sector fund-flow archive [skip ci]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push || (sleep 5 && git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push)
          else
            echo "存档无变化"
          fi

      # ★ 2026-11-23：存档陈旧即报红（杜绝闸门跳过 / 数据源被封造成的静默停更）
      - name: Verify archive freshness
        run: node check-freshness.js flow-history.json days 1

      # 提交成功后清 jsDelivr 分支缓存（@main 约 12h）—— 否则控制台的 jsDelivr 兜底源会长时间返回昨日旧档
      - name: Purge jsDelivr cache
        run: |
          for f in flow-history.json; do
            curl -sS --max-time 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}/${f}" || true
            echo "purged $f"
          done
